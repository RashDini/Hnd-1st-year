<!DOCTYPE html>
<html>
    <head></head>
        <title>Level 1</title>
        
       
        <link rel="stylesheet" href="Level1.css">
    </head>

    <body class="body" onload="Idle()"  onkeypress="keyCheck(event);">
        <div class="background" id="background">
            <img src="images/Idle(1).png" class="boy" id="boy"/>

            <div class="ss">Score: </div>
            <div class="score" id="score">0</div>   

        
        <!---- Game Over Screen-->
        <div class="end" id="end">
            <div style="color: rgb(251,255,11);">Game Over</div>
            <div style="color: rgb(145,189,0);">Your Score</div>
            <div style="color: rgb(54,200,223);" id="endScore">0</div>
            <button class="btn" onclick="reload();">Restart</button>
        </div>
        
          <!--Game Win Screen-->
        <div id="win" style="display: none;">
                <h1>Congratulations! You Win!</h1>
                <p>You have successfully completed Level 1 <span id="currentLevel()"></span>!</p>
                <button onclick="gotoNextLevel()">Go to Level 2</button>
        </div>
            

       
    

        <script src="Level1.js"></script>
    </body>
</html>
