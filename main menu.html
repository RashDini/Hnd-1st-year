<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="main menu.CSS">
</head>
<body>
    <div id="Main Menu">
        <h1 class="title">WELCOME TO THE  GAME</h1>
        <h3 class="titletwo">JUMP AND RUN BOY</h3>
        <button id="play-btn">Play</button>
        <button id="instructions-btn"> Instructions</button>
        <div id="message-box" class="hidden">
            <p>-- Use the "Enter Key" to Run Forward to the boy. </p>
            <p>-- Press "Space Bar" for jump over the fire.</p>
            <p>-- To Enter the Level 1 Player should get 1000 scores.</p>
            <p>-- To Enter the Level 2 Player should get 1500 scores.</p>
            <button id="close-btn">Close</button>
        </div>
        <button id="exit-btn">Exit</button>
    </div>

</body>

<script src="main menu.JS"></script>

</html>
